syntax = "proto3";
package Protocol;

import "Enum.proto";

message BuffData
{
	uint64 buffId = 1;
	float remainTime = 2;
	repeated uint64 victims = 3;
}

message ObjectInfo
{
	uint64 objectId = 1;
	OBJECT_TYPE objectType = 2;
	OBJECT_STATE_TYPE state = 3;
	DIR_TYPE dir = 4;
	string name = 5;
	int32 hp = 6;
	int32 maxHp = 7;
	int32 attack = 8;
	int32 defence = 9;
	int32 posX = 10;
	int32 posY = 11;
	int32 money = 12;
}

message AttackInfo
{
	uint64 objectId = 1;
	uint64 targetId = 2;
	int32 damege = 3;
}

message AttackArrowInfo
{
	uint64 objectId = 1;
	uint64 targetId = 2;
	int32 damege = 3;
	bool hitFlag = 4;
}